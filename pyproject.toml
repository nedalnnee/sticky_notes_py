[project]
name = "sticky-notes"
version = "1.1.0"
description = "Modern Python Sticky Notes for Windows with System Tray Integration"
authors = [{ name = "Sticky Notes App" }]
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.6.0",
    "Pillow>=10.0.0",
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
